name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A4D058: ${{ secrets.A4D058 }}
          B134FB: ${{ secrets.B134FB }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A4D058', '')
          meta_b = os.environ.get('B134FB', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 77b7770eee01449c34be384fe61a182bf48edd4f -->', meta_a)
          if meta_b:
              out = out.replace('<!-- cb2fb02dbc6c54848b6f955ad66e21a7030ecb -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
